# tmux 3.6 - ghostty + fish + nvim on macos
#
# windows are the tabs here. ghostty's native macos tabs are each a separate
# NSWindow, so aerospace tiles them against each other and the visible one
# shrinks to a slice. one ghostty window + tmux windows sidesteps that.

# --- terminal

set -g default-shell /opt/homebrew/bin/fish
set -g default-terminal "tmux-256color"
# tmux's builtin xterm* rules already cover xterm-ghostty, minus truecolor
set -as terminal-features ",xterm-ghostty:RGB"
set -g escape-time 20           # the 500ms default makes esc feel broken in nvim
set -g focus-events on          # nvim autoread and gitsigns need these
set -g allow-passthrough on     # nvim image/OSC sequences go straight to ghostty
set -g history-limit 100000
set -s set-clipboard on         # y in copy mode reaches the macos clipboard, ssh included

# --- behaviour

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g status-keys emacs        # vi keys in copy mode, emacs keys at the command prompt
setw -g aggressive-resize on
set -g detach-on-destroy off   # closing the last window lands in another session, not out

# --- cmd keys
#
# ghostty sends a unique CSI sequence per cmd key (see ~/.config/ghostty/config) and
# they're bound in the root table, so they need no prefix and work inside nvim too.
# why not just send the prefix: macos owns C-Space for input sources, ghostty's text:
# action can't carry a NUL byte, and ghostty's own cmd+1..9 tab bindings beat any
# user override right now (ghostty-org/ghostty discussions 8756 and 3187).
#
# to check what ghostty actually sends: run `cat -v` in a pane and press the key.

set -s user-keys[1] "\e[9101~"
set -s user-keys[2] "\e[9102~"
set -s user-keys[3] "\e[9103~"
set -s user-keys[4] "\e[9104~"
set -s user-keys[5] "\e[9105~"
set -s user-keys[6] "\e[9106~"
set -s user-keys[7] "\e[9107~"
set -s user-keys[8] "\e[9108~"
set -s user-keys[9] "\e[9109~"
bind -n User1 select-window -t :=1
bind -n User2 select-window -t :=2
bind -n User3 select-window -t :=3
bind -n User4 select-window -t :=4
bind -n User5 select-window -t :=5
bind -n User6 select-window -t :=6
bind -n User7 select-window -t :=7
bind -n User8 select-window -t :=8
bind -n User9 select-window -t :=9

set -s user-keys[10] "\e[9110~"
set -s user-keys[11] "\e[9111~"
set -s user-keys[12] "\e[9112~"
set -s user-keys[13] "\e[9113~"
set -s user-keys[14] "\e[9114~"
set -s user-keys[15] "\e[9115~"
set -s user-keys[16] "\e[9116~"
set -s user-keys[17] "\e[9117~"
set -s user-keys[18] "\e[9118~"
set -s user-keys[19] "\e[9119~"
set -s user-keys[20] "\e[9120~"
set -s user-keys[21] "\e[9121~"
set -s user-keys[22] "\e[9122~"

bind -n User10 switch-client -T prefix              # cmd+b, the prefix
bind -n User11 new-window -c "#{pane_current_path}" # cmd+t
bind -n User12 previous-window                      # cmd+shift+[
bind -n User13 next-window                          # cmd+shift+]
bind -n User14 split-window -h -c "#{pane_current_path}" # cmd+d
bind -n User15 split-window -v -c "#{pane_current_path}" # cmd+shift+d
bind -n User16 select-pane -L                       # cmd+h
bind -n User17 select-pane -D                       # cmd+j
bind -n User18 select-pane -U                       # cmd+k
bind -n User19 select-pane -R                       # cmd+l
bind -n User20 display-popup -E -d "#{pane_current_path}" -w 80% -h 70%  # cmd+enter
bind -n User21 command-prompt -I "#W" "rename-window '%%'"               # cmd+shift+r
# cmd+w. asks first, because a window here can be holding a running server
bind -n User22 confirm-before -p "close #W? (y/n)" kill-window

# --- prefix
# no ctrl key is stolen from fish or nvim: cmd+b enters the prefix table above.
# if that ever breaks, `tmux set -g prefix C-a` from any shell gets you a real one.
set -g prefix None

# --- prefix bindings, for the things that don't need a dedicated key

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.config/tmux/tmux.conf \; display -d 1000 "reloaded"

# --- popups, cheaper than a split on a 13"

bind Enter display-popup -E -d "#{pane_current_path}" -w 80% -h 70%
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "jj root >/dev/null 2>&1 && jjui || lazygit"
# session picker, see ~/.config/fish/functions/t.fish. -l because the tmux server
# inherits ghostty's bare env, not a fish login env
bind s display-popup -E -w 60% -h 50% "/opt/homebrew/bin/fish -l -c t"

# --- copy mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- status
# bg=default and palette numbers, so it follows whatever ghostty theme is loaded

set -g status-position top
set -g status-style "bg=default,fg=colour8"
set -g status-justify left
set -g status-left "#[bold]#S  "
set -g status-right "#{?client_prefix,#[reverse] prefix #[noreverse],}"
set -g window-status-separator ""
set -g window-status-format " #I #W "
set -g window-status-current-format "#[bold,fg=colour4] #I #W "
